# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate_node_lts:
    permissions:
      contents: read
    name: Validate Using Latest Node LTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          # NOTE: Currently does not support mise.toml
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-format
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test-run-coverage

      - name: Upload website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/_site

  deploy:
    name: Deploy to mlaursen.com
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate_node_lts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the
    # run in-progress and latest queued. However, do NOT cancel in-progress
    # runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
